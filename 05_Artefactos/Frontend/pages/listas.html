<!doctype html>
<html lang="pt-PT">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Listas candidatas, propostas e regras de apresentação das candidaturas.">

  <title>Listas académicas | TrustVote</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,500..700;1,8..60,500..700&display=swap">
  <link rel="stylesheet" href="../css/style.css?v=20">
  <link rel="stylesheet" href="../css/tailwind.css?v=20">
  <script defer src="../js/views/icones.js?v=20"></script>
  <script defer src="../js/views/layout.js?v=20"></script>
  <!-- Base comum: models (dados e servidor) + formatação e componentes partilhados -->
  <script defer src="../js/models/servidor.js?v=20"></script>
  <script defer src="../js/models/api.js?v=20"></script>
  <script defer src="../js/models/sessao.js?v=20"></script>
  <script defer src="../js/views/formatar.js?v=20"></script>
  <script defer src="../js/models/eleicoes.js?v=20"></script>
  <script defer src="../js/views/componentes.js?v=20"></script>
  <!-- View: desenho do HTML -->
  <script defer src="../js/views/graficos.js?v=20"></script>
  <script defer src="../js/views/publico.js?v=20"></script>
  <!-- Controller: o que acontece em cada página -->
  <script defer src="../js/controllers/comum/menu.js?v=20"></script>
  <script defer src="../js/controllers/comum/pagina.js?v=20"></script>
  <script defer src="../js/controllers/publico/paginas.js?v=20"></script>
  <script defer src="../js/views/animacoes.js?v=20"></script>
</head>

<body>

  <!-- Cabeçalho TrustVote -->
  <div data-layout="cabecalho"></div>

  <!-- Caminho da página -->
  <div data-layout="caminho" data-seccao="Listas académicas" data-seccao-link="listas.html"
    data-atual="Listas candidatas" data-atual-muda></div>

  <main id="conteudo"
    class="container section-page grid-cols-1 lg:grid-cols-[280px_minmax(0,1fr)] xl:grid-cols-[300px_minmax(0,1fr)]">

    <!-- Menu da secção -->
    <aside class="section-aside">
      <div class="side-menu overflow-hidden">
        <h2>Listas académicas</h2>
        <nav aria-label="Listas académicas">
          <a href="#listas-candidatas">Listas candidatas</a>
        </nav>
      </div>
      <div class="manager-card">
        <h2>Gestor responsável</h2>
        <a href="ajuda.html#contactos">Comissão Eleitoral Académica <svg class="icon" aria-hidden="true">
            <use href="#i-chevron-right"></use>
          </svg></a>
      </div>
    </aside>

    <!-- Conteúdo: um tema de cada vez -->
    <div class="section-content">
      <article class="section-item" id="listas-candidatas" data-item>
        <div class="section-item-head">
          <h1>Listas candidatas</h1>
          <div class="section-item-tools">
            <button class="pill-button" type="button" data-share><svg class="icon" aria-hidden="true">
                <use href="#i-share"></use>
              </svg> Partilhar</button>
            <button class="pill-button" type="button" data-print><svg class="icon" aria-hidden="true">
                <use href="#i-printer"></use>
              </svg> Imprimir</button>
          </div>
        </div>
        <p class="lead" data-listas-lead>Listas candidatas: quem são e o que propõem.</p>

        <div class="candidate-grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3" data-candidates></div>

        <p class="notice">A obter as listas a partir da plataforma…</p>
      </article>

      <div class="visit-also" data-visit-also></div>
    </div>

  </main>

  <!-- Rodapé TrustVote -->
  <div data-layout="rodape"></div>

</body>

</html>
