<!doctype html>
<html lang="pt-PT">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Momentos que marcaram as eleições académicas na plataforma TrustVote.">

  <title>Histórico eleitoral | TrustVote</title>

  <link rel="stylesheet" href="../css/style.css?v=6">
  <link rel="stylesheet" href="../css/tailwind.css?v=6">
  <script defer src="../js/views/layout.js?v=6"></script>
  <script defer src="../js/models/servidor.js?v=6"></script>
  <script defer src="../js/models/api.js?v=6"></script>
  <script defer src="../js/models/sessao.js?v=6"></script>
  <script defer src="../js/views/formatar.js?v=6"></script>
  <script defer src="../js/models/eleicoes.js?v=6"></script>
  <script defer src="../js/views/componentes.js?v=6"></script>
  <script defer src="../js/views/graficos.js?v=6"></script>
  <script defer src="../js/views/publico.js?v=6"></script>
  <script defer src="../js/controllers/comum/menu.js?v=6"></script>
  <script defer src="../js/controllers/comum/pagina.js?v=6"></script>

<body>

  <!-- Cabeçalho TrustVote -->
  <div data-layout="cabecalho"></div>

  <!-- Caminho da página -->
  <div data-layout="caminho" data-seccao="Histórico eleitoral" data-seccao-link="historico.html"
    data-atual="Eleições académicas"></div>

  <main>

    <section class="history-hero" style="background-image:url('../assets/01_iade_campus_patio_exterior.png')">
      <div class="container">
        <h1>Histórico Eleitoral</h1>
      </div>
    </section>

    <section class="history-intro">
      <div class="container">
        <p>Eleições académicas já encerradas, com as datas e a participação registadas na plataforma.</p>
      </div>
    </section>

    <!-- Eleições encerradas (preenchido por controllers/publico/paginas.js) -->
    <div class="container history-list" data-history></div>

  </main>

  <!-- Rodapé TrustVote -->
  <div data-layout="rodape"></div>

</body>

</html>
