<!doctype html>
<html lang="pt-PT">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Centro de operações | TrustVote</title>
    <link rel="stylesheet" href="../css/style.css?v=20">
    <link rel="stylesheet" href="../css/tailwind.css?v=20">
    <!-- Base comum: models (dados e servidor) + formatação e componentes partilhados -->
    <script defer src="../js/views/icones.js?v=20"></script>
    <script defer src="../js/models/servidor.js?v=20"></script>
    <script defer src="../js/models/api.js?v=20"></script>
    <script defer src="../js/models/sessao.js?v=20"></script>
    <script defer src="../js/views/formatar.js?v=20"></script>
    <script defer src="../js/models/eleicoes.js?v=20"></script>
    <script defer src="../js/views/componentes.js?v=20"></script>
    <script defer src="../js/models/resultados.js?v=20"></script>
    <!-- View: desenho do HTML -->
    <script defer src="../js/views/palavra-passe.js?v=20"></script>
    <script defer src="../js/views/graficos.js?v=20"></script>
    <script defer src="../js/views/equipa/visao-geral.js?v=20"></script>
    <script defer src="../js/views/equipa/eleicoes.js?v=20"></script>
    <script defer src="../js/views/equipa/candidatos-e-eleitores.js?v=20"></script>
    <script defer src="../js/views/equipa/resultados.js?v=20"></script>
    <script defer src="../js/views/equipa/auditoria-e-configuracao.js?v=20"></script>
    <!-- Controller: o que acontece em cada página -->
    <script defer src="../js/controllers/comum/menu.js?v=20"></script>
    <script defer src="../js/controllers/comum/paineis.js?v=20"></script>
    <script defer src="../js/controllers/comum/pagina.js?v=20"></script>
    <script defer src="../js/controllers/comum/palavra-passe.js?v=20"></script>
    <script defer src="../js/controllers/comum/descarregar.js?v=20"></script>
    <script defer src="../js/controllers/equipa/visao-geral.js?v=20"></script>
    <script defer src="../js/controllers/equipa/eleicoes.js?v=20"></script>
    <script defer src="../js/controllers/equipa/eleicao-detalhes.js?v=20"></script>
    <script defer src="../js/controllers/equipa/candidatos-e-eleitores.js?v=20"></script>
    <script defer src="../js/controllers/equipa/resultados.js?v=20"></script>
    <script defer src="../js/controllers/equipa/auditoria-e-configuracao.js?v=20"></script>
    <script defer src="../js/controllers/equipa/arranque.js?v=20"></script>
    <script defer src="../js/views/animacoes.js?v=20"></script>
</head>

<body class="panel-body" data-page="admin">

    <!-- Cabeçalho com o menu do painel -->
    <header class="dashboard-header">

        <a class="brand" href="inicio.html">
            <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg></span>
            <span>
                <b>TRUSTVOTE</b>
                <small>ELEIÇÕES ACADÉMICAS</small>
            </span>
        </a>

        <nav class="panel-nav" aria-label="Navegação da área da equipa">
            <button class="panel-link active" type="button" data-view="overview">Visão
                geral</button>
            <button class="panel-link" type="button"
                data-view="elections">Eleições</button>
            <button class="panel-link" type="button"
                data-view="candidates">Candidatos</button>
            <button class="panel-link" type="button" data-view="voters">Eleitores</button>
            <button class="panel-link" type="button"
                data-view="results">Resultados</button>
            <button class="panel-link" type="button" data-view="audit">Auditoria</button>
            <button class="panel-link" type="button"
                data-view="settings">Configuração</button>
        </nav>

        <div class="panel-user">
            <span class="session-chip" data-session-chip>SESSÃO SEGURA</span>
            <span class="user-chip" data-user-chip></span>
            <a class="portal-link" href="inicio.html">Portal <svg class="icon" aria-hidden="true"><use href="#i-arrow-up-right"></use></svg></a>
            <button class="logout-button" type="button" data-logout aria-label="Terminar sessão"
                title="Terminar sessão"><svg class="icon" aria-hidden="true"><use href="#i-log-out"></use></svg></button>
        </div>

    </header>

    <div class="dashboard-wrap">

        <!-- Conteúdo principal -->
        <main class="dashboard-content">

            <!-- VISÃO OPERACIONAL -->
            <section class="view-panel active" data-panel="overview"></section>

            <!-- ELEIÇÕES -->
            <section class="view-panel" data-panel="elections"></section>

            <!-- CANDIDATOS -->
            <section class="view-panel" data-panel="candidates"></section>

            <!-- ELEITORES -->
            <section class="view-panel" data-panel="voters"></section>

            <!-- RESULTADOS -->
            <section class="view-panel" data-panel="results"></section>

            <!-- AUDITORIA -->
            <section class="view-panel" data-panel="audit"></section>

            <!-- CONFIGURAÇÃO -->
            <section class="view-panel" data-panel="settings"></section>

        </main>
    </div>

</body>

</html>
