<!doctype html>
<html lang="pt-PT">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Área do eleitor | TrustVote</title>

    <link rel="stylesheet" href="../css/style.css?v=6">
    <link rel="stylesheet" href="../css/tailwind.css?v=6">
    <!-- Base comum: models (dados e servidor) + formatação e componentes partilhados -->
    <script defer src="../js/models/servidor.js?v=6"></script>
    <script defer src="../js/models/api.js?v=6"></script>
    <script defer src="../js/models/sessao.js?v=6"></script>
    <script defer src="../js/views/formatar.js?v=6"></script>
    <script defer src="../js/models/eleicoes.js?v=6"></script>
    <script defer src="../js/views/componentes.js?v=6"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <!-- View: desenho do HTML -->
    <script defer src="../js/views/dois-fatores.js?v=6"></script>
    <script defer src="../js/views/graficos.js?v=6"></script>
    <script defer src="../js/views/eleitor/eleicoes.js?v=6"></script>
    <script defer src="../js/views/eleitor/visao-geral-e-boletim.js?v=6"></script>
    <script defer src="../js/views/eleitor/sondagem-e-resultados.js?v=6"></script>
    <script defer src="../js/views/eleitor/recibos.js?v=6"></script>
    <script defer src="../js/views/eleitor/perfil.js?v=6"></script>
    <!-- Controller: o que acontece em cada página -->
    <script defer src="../js/controllers/comum/menu.js?v=6"></script>
    <script defer src="../js/controllers/comum/paineis.js?v=6"></script>
    <script defer src="../js/controllers/comum/pagina.js?v=6"></script>
    <script defer src="../js/controllers/comum/dois-fatores.js?v=6"></script>
    <script defer src="../js/controllers/comum/descarregar.js?v=6"></script>
    <script defer src="../js/controllers/eleitor/eleicoes.js?v=6"></script>
    <script defer src="../js/controllers/eleitor/boletim.js?v=6"></script>
    <script defer src="../js/controllers/eleitor/sondagem-e-resultados.js?v=6"></script>
    <script defer src="../js/controllers/eleitor/recibos.js?v=6"></script>
    <script defer src="../js/controllers/eleitor/perfil.js?v=6"></script>
    <script defer src="../js/controllers/eleitor/arranque.js?v=6"></script>
    <script defer src="../js/views/animacoes.js?v=6"></script>
</head>

<body class="panel-body" data-page="voter">

    <!-- Cabeçalho com o menu do painel -->
    <header class="dashboard-header">

        <a class="brand" href="inicio.html">
            <span class="brand-mark">✓</span>
            <span>
                <b>TRUSTVOTE</b>
                <small>ELEIÇÕES ACADÉMICAS</small>
            </span>
        </a>

        <nav class="panel-nav" aria-label="Navegação da área do eleitor">
            <button class="panel-link rounded-lg transition-colors active" type="button" data-view="overview">Visão
                geral</button>
            <button class="panel-link rounded-lg transition-colors" type="button"
                data-view="elections">Eleições</button>
            <button class="panel-link rounded-lg transition-colors" type="button" data-view="poll">Sondagem IA</button>
            <button class="panel-link rounded-lg transition-colors" type="button" data-view="receipts">Recibos</button>
            <button class="panel-link rounded-lg transition-colors" type="button"
                data-view="results">Resultados</button>
            <button class="panel-link rounded-lg transition-colors" type="button" data-view="help">Ajuda</button>
            <button class="panel-link rounded-lg transition-colors" type="button" data-view="profile">Perfil</button>
        </nav>

        <div class="panel-user">
            <span class="session-chip rounded-lg" data-session-chip>SESSÃO SEGURA</span>
            <span class="user-chip" data-user-chip></span>
            <a class="portal-link" href="inicio.html">Portal ↗</a>
            <button class="logout-button" type="button" data-logout aria-label="Terminar sessão"
                title="Terminar sessão">↪</button>
        </div>

    </header>

    <div class="dashboard-wrap">

        <!-- Conteúdo principal -->
        <main class="dashboard-content">

            <!-- VISÃO GERAL -->
            <section class="view-panel active" data-panel="overview"></section>


            <!-- ELEIÇÕES -->
            <section class="view-panel" data-panel="elections"></section>


            <!-- SONDAGENS -->
            <section class="view-panel" data-panel="poll"></section>


            <!-- RESULTADOS -->
            <section class="view-panel" data-panel="results"></section>


            <!-- RECIBOS -->
            <section class="view-panel" data-panel="receipts"></section>


            <!-- AJUDA -->
            <section class="view-panel" data-panel="help">

                <p class="eyebrow">APOIO AO ELEITOR</p>

                <h1>Como podemos ajudar?</h1>

                <article class="dash-card rounded-2xl shadow-soft transition-shadow duration-300 hover:shadow-lift">
                    <h2>Dúvidas sobre a votação</h2>
                    <p>Veja as respostas às perguntas mais comuns ou fale com a comissão eleitoral académica.</p>
                    <a class="button rounded-xl button-outline" href="ajuda.html#perguntas-frequentes">Perguntas frequentes →</a>
                </article>

            </section>


            <!-- PERFIL (preenchido por controllers/eleitor/perfil.js) -->
            <section class="view-panel" data-panel="profile"></section>

        </main>

    </div>

</body>

</html>
