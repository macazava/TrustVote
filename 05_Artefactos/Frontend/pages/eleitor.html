<!doctype html>
<html lang="pt-PT">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Área do eleitor | TrustVote</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,500..700;1,8..60,500..700&display=swap">
    <link rel="stylesheet" href="../css/style.css?v=20">
    <link rel="stylesheet" href="../css/tailwind.css?v=20">
    <!-- Base comum: models (dados e servidor) + formatação e componentes partilhados -->
    <script defer src="../js/views/icones.js?v=20"></script>
    <script defer src="../js/models/servidor.js?v=20"></script>
    <script defer src="../js/models/api.js?v=20"></script>
    <script defer src="../js/models/sessao.js?v=20"></script>
    <script defer src="../js/views/formatar.js?v=20"></script>
    <script defer src="../js/models/eleicoes.js?v=20"></script>
    <script defer src="../js/views/componentes.js?v=20"></script>
    <!-- View: desenho do HTML -->
    <script defer src="../js/views/palavra-passe.js?v=20"></script>
    <script defer src="../js/views/graficos.js?v=20"></script>
    <script defer src="../js/views/eleitor/eleicoes.js?v=20"></script>
    <script defer src="../js/views/eleitor/visao-geral-e-boletim.js?v=20"></script>
    <script defer src="../js/views/eleitor/sondagem-e-resultados.js?v=20"></script>
    <script defer src="../js/views/eleitor/recibos.js?v=20"></script>
    <script defer src="../js/views/eleitor/perfil.js?v=20"></script>
    <!-- Controller: o que acontece em cada página -->
    <script defer src="../js/controllers/comum/menu.js?v=20"></script>
    <script defer src="../js/controllers/comum/paineis.js?v=20"></script>
    <script defer src="../js/controllers/comum/pagina.js?v=20"></script>
    <script defer src="../js/controllers/comum/palavra-passe.js?v=20"></script>
    <script defer src="../js/controllers/comum/descarregar.js?v=20"></script>
    <script defer src="../js/controllers/eleitor/eleicoes.js?v=20"></script>
    <script defer src="../js/controllers/eleitor/boletim.js?v=20"></script>
    <script defer src="../js/controllers/eleitor/sondagem-e-resultados.js?v=20"></script>
    <script defer src="../js/controllers/eleitor/recibos.js?v=20"></script>
    <script defer src="../js/controllers/eleitor/perfil.js?v=20"></script>
    <script defer src="../js/controllers/eleitor/arranque.js?v=20"></script>
    <script defer src="../js/views/animacoes.js?v=20"></script>
</head>

<body class="panel-body" data-page="voter">

    <!-- Cabeçalho com o menu do painel -->
    <header class="dashboard-header">

        <a class="brand" href="inicio.html">
            <span class="brand-mark"><svg class="icon" aria-hidden="true">
                    <use href="#i-check"></use>
                </svg></span>
            <span>
                <b>TRUSTVOTE</b>
                <small>ELEIÇÕES ACADÉMICAS</small>
            </span>
        </a>

        <nav class="panel-nav" aria-label="Navegação da área do eleitor">
            <button class="panel-link active" type="button" data-view="overview">Visão
                geral</button>
            <button class="panel-link" type="button" data-view="elections">Eleições</button>
            <button class="panel-link" type="button" data-view="poll">Sondagem</button>
            <button class="panel-link" type="button" data-view="receipts">Recibos</button>
            <button class="panel-link" type="button" data-view="results">Resultados</button>
            <button class="panel-link" type="button" data-view="help">Ajuda</button>
            <button class="panel-link" type="button" data-view="profile">Perfil</button>
        </nav>

        <div class="panel-user">
            <span class="session-chip" data-session-chip>SESSÃO SEGURA</span>
            <span class="user-chip" data-user-chip></span>
            <a class="portal-link" href="inicio.html">Portal <svg class="icon" aria-hidden="true">
                    <use href="#i-arrow-up-right"></use>
                </svg></a>
            <button class="logout-button" type="button" data-logout aria-label="Terminar sessão"
                title="Terminar sessão"><svg class="icon" aria-hidden="true">
                    <use href="#i-log-out"></use>
                </svg></button>
        </div>

    </header>

    <div class="dashboard-wrap">

        <!-- Conteúdo principal -->
        <main class="dashboard-content">

            <!-- VISÃO GERAL -->
            <section class="view-panel active" data-panel="overview"></section>


            <!-- ELEIÇÕES -->
            <section class="view-panel" data-panel="elections"></section>


            <!-- SONDAGENS -->
            <section class="view-panel" data-panel="poll"></section>


            <!-- RESULTADOS -->
            <section class="view-panel" data-panel="results"></section>


            <!-- RECIBOS -->
            <section class="view-panel" data-panel="receipts"></section>


            <!-- AJUDA -->
            <section class="view-panel" data-panel="help"></section>


            <!-- PERFIL (preenchido por controllers/eleitor/perfil.js) -->
            <section class="view-panel" data-panel="profile"></section>

        </main>

    </div>

</body>

</html>
