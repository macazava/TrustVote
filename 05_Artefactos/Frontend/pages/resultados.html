<!doctype html>
<html lang="pt-PT">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Participação e resultados das eleições no TrustVote.">

  <title>Resultados | TrustVote</title>

  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="../js/tailwind.config.js"></script>
  <script defer src="../js/layout.js"></script>
  <script defer src="../js/main.js"></script>
  <script defer src="../js/demo.js"></script>
  <script defer src="../js/api.js"></script>
  <script defer src="../js/site.js"></script>
  <script defer src="../js/publico.js"></script>
  <script defer src="../js/animacoes.js"></script>
</head>

<body>

  <!-- Cabeçalho TrustVote -->
  <div data-layout="cabecalho"></div>

  <!-- Caminho da página -->
  <div data-layout="caminho" data-atual="Resultados"></div>

  <main class="container content-page">

    <p class="eyebrow">ELEIÇÕES E RESULTADOS</p>

    <h1>Resultados</h1>

    <p class="lead">
      Participação e resultados das eleições académicas.
    </p>

    <!-- Preenchido com os dados da API -->
    <div data-results></div>

    <p class="notice rounded-xl">
      Os resultados finais são publicados pela comissão eleitoral académica
      depois da contagem dos votos.
    </p>

  </main>

  <!-- Rodapé TrustVote -->
  <div data-layout="rodape"></div>

</body>

</html>
