name: trustvote


services:
  db:
    image: postgres:16
    container_name: trustvote1
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: trustvote
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      TRUSTVOTE_DB_PASSWORD: ${TRUSTVOTE_DB_PASSWORD:?Defina TRUSTVOTE_DB_PASSWORD no arquivo .env}

    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - trustvote-db-data:/var/lib/postgresql/data
      - ./00-trustvote-user.sql:/docker-entrypoint-initdb.d/00-trustvote-user.sql:ro
      - ./trustvote.sql:/docker-entrypoint-initdb.d/01-trustvote.sql:ro


    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7
    container_name: trustvote-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no arquivo .env}
    command: [ "sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes" ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - trustvote-redis-data:/data

    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


volumes:
  trustvote-db-data:
  trustvote-redis-data:
