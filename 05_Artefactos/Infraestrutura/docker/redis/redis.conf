# TrustVote — Redis (cache / filas / coordenação; NÃO é a fonte de verdade dos dados)
# A password é passada no arranque (--requirepass) a partir do .env.

bind 0.0.0.0
port 6379
protected-mode yes

# Persistência: AOF para sobreviver a reinícios do contentor
appendonly yes
appendfsync everysec
dir /data

# Limite de memória para não crescer sem controlo (ajustar se for usado como fila)
maxmemory 256mb
maxmemory-policy noeviction

# Comandos perigosos desativados
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
