# TrustVote — reverse proxy / balanceador de carga

# DNS interno do Docker: os nomes servidor1/servidor2 são resolvidos de novo a cada 10s,
# por isso um contentor recriado (IP novo) volta a receber pedidos sem reiniciar o nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

# Regista para cada pedido a instância que respondeu e o estado de cada tentativa.
log_format trustvote '$remote_addr [$time_local] "$request" $status '
                     'upstream=$upstream_addr upstream_status=$upstream_status '
                     'rt=$request_time urt=$upstream_response_time';

upstream trustvote_app {
    zone trustvote_app 64k;          # necessário para "resolve"

    # Round-robin. Deteção passiva: após 2 falhas em 10s a instância é
    # retirada durante 10s, e depois volta a ser experimentada.
    server servidor1:8080 resolve max_fails=2 fail_timeout=10s;
    server servidor2:8080 resolve max_fails=2 fail_timeout=10s;

    keepalive 16;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log trustvote;

    # Saúde do próprio nginx (usado pelo healthcheck do contentor)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://trustvote_app;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_read_timeout    30s;

        # Se uma instância falhar, tenta a outra. O nginx NÃO repete pedidos não idempotentes
        # (POST de voto, etc.) que já tenham chegado à instância, evitando votos duplicados.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        # Permite ver qual instância respondeu (útil para testes de balanceamento)
        add_header X-Upstream-Server $upstream_addr always;
    }
}
