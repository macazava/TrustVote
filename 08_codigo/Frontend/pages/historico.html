<!doctype html>
<html lang="pt-PT">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Modo claro/escuro aplicado já, antes de a página aparecer (sem piscar em claro). A mesma regra de
       js/controllers/comum/pagina.js: a escolha guardada ou, sem escolha, o modo do sistema operativo. -->
  <script>try { var p = JSON.parse(localStorage.getItem("trustvote:preferencias") || "{}"); document.documentElement.dataset.theme = (p.theme ? p.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light" } catch (e) { }</script>
  <meta name="description" content="Momentos que marcaram as eleições académicas na plataforma TrustVote.">

  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%231f5a45%27/%3E%3Cpath d=%27M9 16.5l4.5 4.5L23 11%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%273%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
  <title>Histórico eleitoral | TrustVote</title>

  <!-- Letras servidas pelo próprio site (css/base/fontes.css): a de texto é pedida logo -->
  <link rel="preload" href="../assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/style.css">
  <script defer src="../js/views/icones.js"></script>
  <script defer src="../js/views/layout.js"></script>
  <script defer src="../js/models/servidor.js"></script>
  <script defer src="../js/models/api.js"></script>
  <script defer src="../js/models/sessao.js"></script>
  <script defer src="../js/views/formatar.js"></script>
  <script defer src="../js/models/eleicoes.js"></script>
  <script defer src="../js/views/componentes.js"></script>
  <script defer src="../js/views/graficos.js"></script>
  <script defer src="../js/views/publico.js"></script>
  <script defer src="../js/controllers/comum/menu.js"></script>
  <script defer src="../js/controllers/comum/pagina.js"></script>
  <script defer src="../js/controllers/publico/paginas.js"></script>
  <script defer src="../js/motion.js"></script>
</head>

<body>

  <!-- Cabeçalho TrustVote -->
  <div data-layout="cabecalho"></div>

  <!-- Caminho da página -->
  <div data-layout="caminho" data-seccao="Histórico eleitoral" data-seccao-link="historico.html"
    data-atual="Eleições académicas"></div>

  <main id="conteudo"
    class="container section-page grid-cols-1 lg:grid-cols-[280px_minmax(0,1fr)] xl:grid-cols-[300px_minmax(0,1fr)]">

    <!-- Menu da secção -->
    <aside class="section-aside">
      <div class="side-menu overflow-hidden">
        <h2>Histórico eleitoral</h2>
        <nav aria-label="Histórico eleitoral">
          <a href="#eleicoes-encerradas">Eleições encerradas</a>
        </nav>
      </div>
      <div class="manager-card">
        <h2>Gestor responsável</h2>
        <a href="ajuda.html#contactos">Comissão Eleitoral Académica <svg class="icon" aria-hidden="true">
            <use href="#i-chevron-right"></use>
          </svg></a>
      </div>
    </aside>

    <!-- Conteúdo -->
    <div class="section-content">
      <article class="section-item" id="eleicoes-encerradas" data-item>
        <div class="section-item-head">
          <h1>Histórico eleitoral</h1>
        </div>
        <p class="lead">Eleições académicas já encerradas, com as datas e a participação registadas na plataforma.</p>

        <!-- Totais de todas as eleições encerradas (preenchido por controllers/publico/paginas.js) -->
        <dl class="history-stats" data-history-stats hidden></dl>

        <!-- Eleições encerradas (preenchido por controllers/publico/paginas.js) -->
        <div class="history-list" data-history></div>
      </article>
    </div>

  </main>

  <!-- Rodapé TrustVote -->
  <div data-layout="rodape"></div>

</body>

</html>
